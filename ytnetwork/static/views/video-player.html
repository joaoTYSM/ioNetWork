<div class="pw"><div class="player {{music}} paused" id="pl" tabindex="-1">
<video id="vid" playsinline webkit-playsinline preload="auto" poster="{{poster}}" autoplay></video>
<div class="mz"><div class="mbg" style="background-image:url({{poster}})"></div><div class="mc"><div class="art"><img src="{{poster}}" alt=""></div><div class="m1" id="m1"></div><div class="m2" id="m2"></div></div></div>
<div class="bz on" id="bz"><i class="spin"></i></div><div class="fl" id="fl"></div><div class="dt l" id="dtl">−10</div><div class="dt r" id="dtr">+10</div>
<div class="ctl" id="ctl"><div class="pg" id="pg"><div class="bf"></div><div class="pr"></div><div class="kn"></div><div class="tip" id="tip"></div></div>
<div class="row"><button id="pp" class="pb" data-ic="play"></button><button id="nx" class="pb" data-ic="next"></button><div class="vg"><button id="mu" data-ic="vol"></button><input type="range" id="vol" min="0" max="1" step=".05" value="1"></div><span class="tm" id="tm">0:00 / 0:00</span><span class="sp"></span>
<button id="ap" class="swb {{ap}}" data-title="autoplay"><span class="sw"><i></i></span></button><button id="mm" data-title="musicMode" data-ic="{{mmic}}"></button><button id="st" data-title="speed" data-ic="set"></button><button id="fs" data-title="fullscreen" data-ic="fs"></button></div></div>
<div class="mn" id="mn" hidden></div></div></div>
<div class="info"><h1 id="tt"></h1><div class="chrow" id="ch"></div><div class="chrow acts" id="ac"></div><div class="desc skel" id="ds" style="height:84px"></div></div>
<aside class="rel"><div class="rhd"><h3 data-t="upNext"></h3></div><div id="rel"></div></aside><div id="cmt"></div>
